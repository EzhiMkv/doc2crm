[project]
name = "doc2crm"
version = "0.1.0"
description = "LLM-агент «пришёл документ — появилась сделка»: извлечение документов, RAG, интеграция с CRM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastembed>=0.6",
    "asyncpg>=0.29",
    "langgraph>=0.4",
    "aiogram>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["b24client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
